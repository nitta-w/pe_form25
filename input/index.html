<head>

<!--
  スルリム横スクロールストーリーLP v0.6（開発版・画像は相対パス参照）
  設計書: 04_横スクロールLP_シナリオ設計書.md

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; overscroll-behavior:none; }  /* ページ全体のバウンス禁止 */
  body {
    font-family:'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    background:#3a2f3d; display:flex; justify-content:center;
  }
  /* スマホ縦ファースト。PCでは中央にスマホ幅フレーム */
  .app {
    position:relative; width:100%; max-width:480px; height:100dvh;
    background:#fff0f6; overflow:hidden; display:flex; flex-direction:column;
  }

  /* ===== ステージ（上58%で固定・下の文章量に影響されない） ===== */
  .stage { position:relative; flex:0 0 58%; overflow:hidden; }
  .bgstrip { position:absolute; top:0; left:0; height:100%; display:flex; will-change:transform; }
  .bgstrip img { height:100%; width:auto; display:block; margin-right:-1px; }  /* サブピクセル隙間(白線)対策で1px重ねる */
  .bgstrip img.flip { transform:scaleX(-1); }

  .girl {
    position:absolute; left:16%; bottom:4%;
    height:62%; aspect-ratio:440/760; z-index:3;
    transition:transform .1s ease-out;
  }
  .girl.bob { transform:translateY(-1.2%); }
  .girl.idle { animation:idleBob 3s ease-in-out infinite; }
  @keyframes idleBob { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-.7%);} }
  .girl img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; }
  .girl img.on { opacity:1; }

  .fat { position:absolute; height:11%; z-index:2; animation:fatFloat 2.6s ease-in-out infinite; transition:opacity .4s; }
  .fat img { height:100%; }
  /* 小物はゆいの目の前（画面中央帯）に、夢らしくふわっと浮かぶ */
  .prop { position:absolute; bottom:31%; z-index:2; animation:propFloat 3.6s ease-in-out infinite; }
  .prop img { height:100%; filter:drop-shadow(0 10px 14px rgba(90,40,70,.22)); }
  @keyframes propFloat { 0%,100%{ transform:translateY(0) rotate(-1.5deg);} 50%{ transform:translateY(-4%) rotate(1.5deg);} }
  @keyframes fatFloat { 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-22%) rotate(3deg);} }

  /* ストーリーズ式プログレスバー（IG/Telegramの型・SNS既視感） */
  .storybar { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:4px; z-index:9; }
  .storybar span {
    flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.45);
    box-shadow:0 1px 3px rgba(90,40,70,.18); transition:background .5s;
  }
  .storybar span.done { background:#fff; }

  .hud { position:absolute; top:20px; right:10px; z-index:8; display:flex; gap:8px; }
  .hud button {
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.85); color:#b3477a; font-size:17px; font-weight:900;
    box-shadow:0 2px 8px rgba(179,71,122,.25);
  }
  #fatCounter {
    position:absolute; top:22px; left:12px; z-index:8; display:none;
    background:rgba(255,255,255,.85); color:#b3477a; font-weight:900; font-size:13px;
    padding:6px 13px; border-radius:999px; box-shadow:0 2px 8px rgba(179,71,122,.2);
  }

  /* ===== ナレーション帯＋選択肢（下1/3） ===== */
  .talk {
    flex:0 0 118px; background:#fff; border-top:3px solid #ffd3e4;
    padding:12px 16px 8px; overflow-y:auto;
    overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  }
  @media (max-height:700px){ .talk { flex-basis:104px; } .talk__text { font-size:13.5px; } }
  .talk__name { font-size:11px; font-weight:900; color:#e0679a; margin-bottom:2px; }
  .talk__text { font-size:14.5px; font-weight:700; color:#5c4a52; line-height:1.65; }
  /* テロップ内の強調: <b>=色文字 / <em>=蛍光マーカー */
  .talk__text b, .pop__body b { color:#d14e82; }
  .talk__text em, .pop__body em {
    font-style:normal; font-weight:900; color:#c9366e;
    background:linear-gradient(transparent 58%, #ffd9e8 58%);
  }
  .choices {
    flex:1 1 auto; overflow-y:auto; background:#fff;
    padding:4px 14px calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px; align-content:flex-start;
    overscroll-behavior:contain; -webkit-overflow-scrolling:touch;  /* スクロールの親連鎖を遮断 */
  }
  /* Noom式: 選択肢はニュートラル、選んだものだけ濃色反転＋ラジオ丸 */
  .choices button {
    border:none; border-radius:14px; padding:12px 16px; cursor:pointer; flex:0 0 auto;
    background:#f7eef2; color:#5c4a52;
    font-family:inherit; font-size:14.5px; font-weight:800; text-align:left;
    transition:transform .08s, background .15s;
  }
  .choices button:active { transform:scale(.97); }
  .choices button.opt { position:relative; padding-left:40px; }
  .choices button.opt::before {
    content:''; position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; border-radius:50%;
    border:2px solid #dcc2cf; background:#fff;
  }
  .choices button.sel {
    background:linear-gradient(135deg,#e0679a,#c9557f); color:#fff;
    box-shadow:0 3px 10px rgba(201,85,127,.35);
  }
  .choices button.sel::before { border-color:#fff; box-shadow:inset 0 0 0 3.5px #fff; background:#d14e82; }
  .choices .tapNext {
    background:#fff; color:#e0679a; border:2px dashed #ffb7d2; text-align:center; box-shadow:none;
  }
  .choices .multiOk {
    background:linear-gradient(135deg,#9fd8a8,#7ac97a); box-shadow:0 3px 10px rgba(122,201,122,.4);
    text-align:center;
  }

  /* タップの「ほわん」演出（やわらかい光の輪が広がって消える） */
  .choices > button, .pop__btn, .gate__btns button, .lineBtn { position:relative; overflow:hidden; }
  .ripple {
    position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.95), rgba(255,214,231,.5) 55%, transparent 72%);
    transform:scale(0);
    animation:rippleGo .65s ease-out forwards;
  }
  @keyframes rippleGo { to { transform:scale(3.2); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .ripple { display:none; } }

  /* ===== 全画面ポップアップ（学習カード・診断書・特典） ===== */
  #pop {
    position:absolute; inset:0; z-index:18; display:none;
    align-items:center; justify-content:center;
    background:rgba(60,35,55,.42); backdrop-filter:blur(3px);
    padding:18px;
  }
  #pop.show { display:flex; }
  .scrollHint {
    position:sticky; bottom:-1px; text-align:center;
    font-size:11px; font-weight:900; color:#e0679a;
    background:linear-gradient(transparent, #fff 60%);
    padding:16px 0 2px; margin-top:-18px;
    animation:hintBob 1.1s ease-in-out infinite;
  }
  @keyframes hintBob { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(4px);} }
  .pop__card {
    width:100%; max-width:360px; max-height:84%;
    display:flex; flex-direction:column;   /* ボタンは常に見える位置に固定 */
    background:#fff; border-radius:20px; padding:20px 18px 16px;
    box-shadow:0 14px 44px rgba(90,40,70,.4);
    animation:popIn .4s ease-out;
  }
  .pop__body { overflow-y:auto; flex:1 1 auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  @keyframes popIn { from{ opacity:0; transform:translateY(16px) scale(.96);} to{ opacity:1; transform:none;} }
  .pop__title { font-size:16px; font-weight:900; color:#d14e82; text-align:center; margin-bottom:10px; }
  .pop__body { font-size:14px; font-weight:700; color:#5c4a52; line-height:1.75; }
  .pop__btn {
    display:block; width:100%; margin-top:14px; border:none; border-radius:999px;
    padding:13px; background:linear-gradient(135deg,#ff9ec0,#f06797); color:#fff;
    font-family:inherit; font-size:15px; font-weight:900; cursor:pointer;
    box-shadow:0 4px 14px rgba(240,103,151,.4);
  }
  .imgph {
    margin:10px 0 4px; padding:26px 10px; border:2px dashed #e8bcd0; border-radius:12px;
    text-align:center; color:#c39aae; font-size:12px; font-weight:700; background:#fdf5f9;
  }
  .badges { display:flex; gap:8px; margin:10px 0 4px; }
  .badges div {
    flex:1; border:2px solid #8fbf9a; border-radius:10px; padding:9px 4px;
    text-align:center; font-size:11px; font-weight:900; color:#4e8b5e; background:#f2faf4;
    line-height:1.45;
  }
  .karte { border:2px solid #e8bcd0; border-radius:12px; padding:12px; background:#fdf7fa; margin-top:8px; }
  .karte__type { font-size:19px; font-weight:900; color:#d14e82; text-align:center; margin-bottom:6px; }
  .gcard {
    position:relative; overflow:hidden;
    border:none; border-radius:16px; padding:15px 14px; margin-top:10px;
    background:linear-gradient(150deg,#fffdf6,#fff3d3 60%,#ffe9b8);
    box-shadow:0 6px 18px rgba(190,140,30,.28), inset 0 0 0 2px #e6c26a, inset 0 0 0 4px #fffbe8;
  }
  .gcard::after {  /* キラーンと光が走る */
    content:''; position:absolute; top:0; left:-80%; width:45%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.9), transparent);
    transform:skewX(-20deg); animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine { 0%{ left:-80%; } 55%, 100%{ left:140%; } }
  .gcard__num { font-size:11px; font-weight:900; color:#b8860b; letter-spacing:.14em; }
  .gcard__t { font-size:17px; font-weight:900; color:#7a5a12; margin:3px 0; }
  .gcard__d { font-size:12.5px; font-weight:700; color:#9a7c3f; line-height:1.6; }
  .price__old { text-decoration:line-through; color:#b0a08a; font-size:13px; }
  .price__now { font-size:24px; font-weight:900; color:#e0426e; }
  /* 全画面セレブレーション（Mobbin: 実在アプリの達成演出の型 = 光背+円形バッジ+テキスト） */
  #banner {
    position:absolute; inset:0; z-index:17; display:none; overflow:hidden;
    align-items:center; justify-content:center; pointer-events:none;
    background:radial-gradient(circle at 50% 44%, rgba(255,242,248,.97), rgba(233,187,209,.93) 72%);
  }
  #banner.show { display:flex; }
  .bn__rays {
    position:absolute; width:160vmax; height:160vmax; left:50%; top:44%;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(rgba(255,255,255,.4) 0 6deg, transparent 6deg 20deg);
    animation:raysSpin 16s linear infinite; opacity:.55;
  }
  @keyframes raysSpin { to { transform:translate(-50%,-50%) rotate(360deg); } }
  .bn__inner { position:relative; text-align:center; animation:bannerIn .55s cubic-bezier(.2,1.4,.4,1); }
  .bn__badge {
    width:120px; height:120px; margin:0 auto 16px; border-radius:50%; background:#fff;
    box-shadow:0 12px 36px rgba(180,80,120,.35), 0 0 0 9px rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center;
  }
  .bn__badge img { max-width:74%; max-height:80%; }
  .bn__title { font-size:21px; font-weight:900; color:#b3477a; letter-spacing:.04em; text-shadow:0 1px 0 #fff; }
  .bn__sub { font-size:12.5px; font-weight:800; color:#a37f90; margin-top:5px; }
  @keyframes bannerIn { from{ transform:scale(.5); opacity:0;} to{ transform:scale(1); opacity:1;} }
  #timer {
    position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:8; display:none;
    background:rgba(255,255,255,.88); color:#b3477a; font-weight:900; font-size:11.5px;
    padding:6px 14px; border-radius:999px; white-space:nowrap;
    box-shadow:0 2px 8px rgba(179,71,122,.18);
  }
  .lineBtn {
    background:#06C755 !important; color:#fff !important; text-align:center !important;
    font-size:16.5px !important; padding:15px !important;
    box-shadow:0 4px 16px rgba(6,199,85,.45) !important;
    animation:pulse 1.6s ease-in-out infinite;
    display:flex !important; align-items:center; justify-content:center; gap:8px;
  }
  .lineBtn svg { width:22px; height:22px; flex:0 0 auto; }
  @keyframes pulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.03);} }

  /* カルーセル（選ばれる理由） */
  .caro { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:10px; margin:6px -6px 2px; padding:2px 6px 6px; }
  .caro::-webkit-scrollbar { display:none; }
  .caro > div {
    flex:0 0 88%; scroll-snap-align:center;
    border:2px solid #f3d3e2; border-radius:14px; padding:12px; background:#fdf7fa;
  }
  .caro .imgph { padding:20px 8px; margin:8px 0 2px; }
  .caroDots { text-align:center; color:#ecc3d6; font-size:11px; letter-spacing:5px; margin-top:6px; }
  .caroDots b { color:#d14e82; }

  /* カレンダー */
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; padding:10px 0 4px; }
  .cal .dow { text-align:center; font-size:10px; font-weight:900; color:#c39aae; padding:2px 0; }
  .cal button {
    position:relative; border:none; border-radius:10px; padding:10px 0;
    background:#f7eef2; color:#5c4a52; font-family:inherit; font-size:13px; font-weight:800; cursor:pointer;
    text-align:center;
  }
  .cal button:disabled { opacity:.25; }
  .cal button.sel { background:linear-gradient(135deg,#e0679a,#c9557f); color:#fff; }
  .cal button.sel::after {
    content:attr(data-ord); position:absolute; top:-6px; right:-4px;
    width:17px; height:17px; border-radius:50%; background:#fff; border:2px solid #d14e82;
    color:#d14e82; font-size:10px; font-weight:900; line-height:14px;
  }
  .cal .mon { grid-column:1/-1; text-align:center; font-size:12px; font-weight:900; color:#b3477a; padding:2px 0; }

  /* ギフトのポンポン出現 */
  .gcard { opacity:0; animation:giftIn .5s cubic-bezier(.25,1.4,.45,1) forwards; }
  .gcard.g1 { animation-delay:.15s; } .gcard.g2 { animation-delay:.8s; } .gcard.g3 { animation-delay:1.45s; } .gcard.g4 { animation-delay:2.1s; }
  @keyframes giftIn { from{ opacity:0; transform:translateY(-16px) scale(.88);} to{ opacity:1; transform:none;} }

  /* スルリム撃退演出 */
  .app.shake { animation:shake .32s; }
  @keyframes shake { 0%,100%{ transform:translate(0);} 25%{ transform:translate(-7px,3px);} 50%{ transform:translate(6px,-3px);} 75%{ transform:translate(-4px,2px);} }
  #syringe {
    position:absolute; right:4%; top:26%; width:88px; z-index:5;
    opacity:0; transform:translateX(40px) rotate(-18deg); transition:opacity .35s, transform .35s;
    filter:drop-shadow(0 4px 8px rgba(90,40,70,.3));
  }
  #syringe.in { opacity:1; transform:translateX(0) rotate(-18deg); }
  #syringe.jab { transform:translateX(-26px) translateY(6px) rotate(-24deg); transition:transform .12s; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; z-index:7; pointer-events:none; transition:opacity .18s; }

  /* 動きを減らす設定のユーザーには装飾アニメを止める（歩行など本質演出は残す） */
  @media (prefers-reduced-motion: reduce) {
    .confetti, .gcard::after { display:none; }
    .lineBtn, .fat, .girl.idle, .scrollHint { animation:none !important; }
    .app.shake { animation:none; }
  }

  /* 紙吹雪 */
  .confetti { position:absolute; top:-4%; width:9px; height:13px; z-index:9; border-radius:2px; animation:confFall linear forwards; }
  @keyframes confFall {
    from { transform:translateY(0) rotate(0); opacity:1; }
    to   { transform:translateY(110vh) rotate(720deg); opacity:.7; }
  }

  /* ===== S0 最小ゲート ===== */
  #gate {
    position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(60,35,55,.28); backdrop-filter:blur(2px);
  }
  .gate__card {
    width:85%; max-width:345px; background:#fff; border-radius:22px;
    padding:26px 22px 22px; text-align:center; box-shadow:0 16px 48px rgba(90,40,70,.32);
    animation:gateIn .5s ease-out;
  }
  @keyframes gateIn { from{ opacity:0; transform:translateY(14px) scale(.97);} to{ opacity:1; transform:none;} }
  .gate__clinic {
    font-size:10px; font-weight:700; color:#c5a3b3; letter-spacing:.3em; text-indent:.3em;
  }
  .gate__mascot { width:56px; display:block; margin:14px auto 2px; }
  .gate__title {
    font-size:24px; font-weight:900; color:#4a3640;
    line-height:1.52; letter-spacing:.04em; margin:8px 0 10px;
  }
  .gate__sub {
    font-size:12.5px; font-weight:800; color:#a37f90; letter-spacing:.08em;
    margin-bottom:18px;
  }
  .gate__chips { display:flex; gap:8px; justify-content:center; margin-bottom:20px; }
  .gate__chips span {
    font-size:11px; font-weight:900; color:#c9557f;
    background:#fbeff5; border:1.5px solid #f3d3e2; border-radius:999px; padding:6px 12px;
  }
  .gate__btns { display:flex; flex-direction:column; gap:10px; }
  .gate__btns button {
    border:none; border-radius:999px; padding:13px; cursor:pointer; font-family:inherit;
    font-size:15px; font-weight:900;
  }
  #startSound { background:linear-gradient(135deg,#ff9ec0,#f06797); color:#fff; box-shadow:0 4px 14px rgba(240,103,151,.45); }
  #startMute { background:none; color:#a5798c; font-size:13px; padding:8px; text-decoration:underline; text-underline-offset:3px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <div class="bgstrip" id="bgstrip"></div>
    <div class="storybar" id="storybar"></div>
    <div id="props"></div>
    <div id="fats"></div>
    <div class="girl" id="girl">
      <img src="assets/walk_1.webp" class="on">
      <img src="assets/walk_2.webp">
      <img src="assets/walk_3.webp">
      <img src="assets/walk_4.webp">
    </div>
    <div id="fatCounter">脂肪くん×0</div>
    <div id="timer"></div>
    <div class="hud"><button id="muteBtn" title="音の切り替え">♪</button></div>

      <div class="bn__rays"></div>
      <div class="bn__inner">
        <div class="bn__badge"><img alt=""></div>

      <rect x="36" y="16" width="26" height="8" rx="2" fill="#ffd3e4"/>
      <rect x="74" y="9" width="7" height="22" rx="2" fill="#e0679a"/>
      <rect x="81" y="17" width="14" height="6" rx="3" fill="#e0679a"/>
      <line x1="30" y1="20" x2="6" y2="20" stroke="#b3477a" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div id="flash"></div>
  </div>
  <div class="talk">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="talk__name" id="talkName">ナレーション</div>
      <div id="qdots" style="font-size:10px; letter-spacing:3px; color:#e0679a;"></div>

<script>
'use strict';
/* ================= 設定（チャット版/クエスト版と互換） ================= */

const store = (() => {
  let ok = true; const mem = {};
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ ok = false; }
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { if(ok) localStorage.setItem(k,v); else mem[k]=v; } catch(e){ mem[k]=v; } },
    del(k){ try { if(ok) localStorage.removeItem(k); else delete mem[k]; } catch(e){ delete mem[k]; } }
  };
})();

/* ================= サウンド（WebAudio・軽量） ================= */
const SND = (() => {
  let ctx = null, muted = true, bgmTimer = null;
  function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
  function tone(f, dur, type, vol, when){
    if (muted) return;
    try {
      const c = ac(), o = c.createOscillator(), g = c.createGain();
      const t = c.currentTime + (when||0);
      o.type = type||'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol||.12, t+.015);
      g.gain.exponentialRampToValueAtTime(.0001, t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
    } catch(e){}
  }
  // ゆるかわBGM: 常時再生。歩き中=軽快 / 停止・カード中=ゆったり低め（無音の寂しさをなくす）
  const seqWalk = [523, 659, 784, 659, 587, 698, 880, 698];
  const seqCalm = [392, 494, 587, 494, 440, 523, 659, 523];
  let step = 0, mood = 'calm';
  function bgmStart(){
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      if (mood === 'calm' && step % 2 === 1) { step++; return; }  // ゆったりは半分のテンポ
      const s = (mood === 'walk') ? seqWalk : seqCalm;
      tone(s[step % 8], mood === 'walk' ? .28 : .55, 'triangle', mood === 'walk' ? .05 : .032);
      step++;
    }, 240);
  }
  function bgmStop(){ clearInterval(bgmTimer); bgmTimer = null; }
  return {
    unlock(withSound){ muted = !withSound; try { ac().resume(); } catch(e){} if (withSound) bgmStart(); },
    setMuted(m){ muted = m; if (m) bgmStop(); else bgmStart(); },
    isMuted(){ return muted; },
    tap(){ tone(880, .09, 'sine', .09); },
    pop(){ tone(392, .16, 'sine', .14); tone(523, .12, 'sine', .1, .05); },
    burst(){ tone(784, .1, 'square', .07); tone(1047, .25, 'sine', .1, .06); tone(1568, .3, 'sine', .06, .12); },
    levelup(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .12, i * .09)); },
    gaan(){ tone(196, .55, 'sawtooth', .07); tone(185, .55, 'sawtooth', .05, .03); },
    blip(){ tone(1250, .025, 'square', .02); },
    walkOn(){ mood = 'walk'; }, walkOff(){ mood = 'calm'; }
  };
})();

/* ================= 背景（鏡面タイル・パララックス） ================= */
const BG = (() => {
  const strip = document.getElementById('bgstrip');
  let x = 0, tileW = 0, cur = '';
  function load(file){
    cur = file;
    strip.innerHTML = '';
    x = 0;
    const h = document.getElementById('stage').clientHeight;
    tileW = Math.ceil(h * 1536 / 1024);
    const need = Math.ceil(document.getElementById('app').clientWidth / tileW) + 2;
    for (let i = 0; i < need + 1; i++) {
      const im = document.createElement('img');
      im.src = ASSET + file;
      if (i % 2 === 1) im.className = 'flip';   // 鏡面タイルで継ぎ目ゼロ
      im.draggable = false;
      strip.appendChild(im);
    }
    strip.style.transform = 'translateX(0)';
  }
  function scroll(dx){
    x -= dx;
    if (x <= -tileW * 2) x += tileW * 2;  // 原画+反転の2枚周期でループ
    strip.style.transform = `translateX(${x}px)`;
  }
  // 場面転換（ふわっと白フェード→差し替え→フェード戻し）
  function change(file){
    if (file === cur) return Promise.resolve();
    return new Promise(res => {
      let fade = document.getElementById('bgfade');
      if (!fade){
        fade = document.createElement('div');
        fade.id = 'bgfade';
        fade.style.cssText = 'position:absolute;inset:0;background:#fff4f9;opacity:0;transition:opacity .45s;z-index:6;pointer-events:none;';
        document.getElementById('stage').appendChild(fade);
      }
      fade.style.opacity = '1';
      setTimeout(() => {
        // 画像の読み込み完了を待ってから差し替え（本番回線での「白抜け」対策）
        const pre = new Image();
        const go = () => {
          load(file);
          requestAnimationFrame(() => {
            fade.style.opacity = '0';
            setTimeout(res, 460);
          });
        };
        pre.onload = go;
        pre.onerror = go;
        pre.src = ASSET + file;
      }, 480);
    });
  }
  return { load, scroll, change };
})();

/* ================= ゆい（歩行エンジン） ================= */
const GIRL = (() => {
  const el = document.getElementById('girl');
  const imgs = [...el.querySelectorAll('img')];
  let frame = 0, walking = false, raf = null, last = 0, acc = 0;
  const FRAME_MS = 1000/7, SPEED = 2.6;  // 歩きテストで決めた7コマ/秒
  function show(n){
    imgs.forEach((im,k)=>im.classList.toggle('on', k===n));
    el.classList.toggle('bob', n===1 || n===3);
  }
  function loop(t){
    if (!walking) return;
    if (!last) last = t;
    const dt = t - last; last = t; acc += dt;
    while (acc >= FRAME_MS) { acc -= FRAME_MS; frame = (frame+1)%4; show(frame); }
    BG.scroll(SPEED * dt / 16.7);
    FAT.drift(SPEED * dt / 16.7);
    raf = requestAnimationFrame(loop);
  }
  // 基本は歩き続ける。止まるのは演出上の特別な瞬間だけ
  function start(){
    if (walking) return;
    walking = true; last = 0; SND.walkOn();
    el.classList.remove('idle');
    raf = requestAnimationFrame(loop);
  }
  function stop(){
    walking = false; cancelAnimationFrame(raf);
    show(0); frame = 0; SND.walkOff();
    el.classList.add('idle');  // 停止中も呼吸モーション（完全静止させない）
  }
  function walk(ms){ start(); return new Promise(res => setTimeout(res, ms)); }
  // 正面ポーズ（表情リアクション）への切り替え。ネガ表情=ガーン音／ポジ表情=レベルアップ音
  let poseImg = null;
  const NEGA_POSES = ['ショック','泣き','おなかつまみ','考え中'];
  function pose(file){
    stop();
    if (!poseImg){
      poseImg = document.createElement('img');
      el.appendChild(poseImg);
    }
    poseImg.src = ASSET + file;
    imgs.forEach(im => im.classList.remove('on'));
    poseImg.classList.add('on');
    if (NEGA_POSES.some(n => file.includes(n))) SND.gaan(); else SND.levelup();
  }
  function unpose(){
    if (poseImg) poseImg.classList.remove('on');
    show(0);
  }
  return { start, stop, walk, pose, unpose };
})();

/* ================= 脂肪くん（浮遊システム） ================= */
const FAT = (() => {
  const wrap = document.getElementById('fats');
  const counter = document.getElementById('fatCounter');
  // スマホ縦基準の散布表（ゆいの背後の空間）
  const spots = [
    {left: 6, bottom: 62}, {left: 1, bottom: 44}, {left: 9, bottom: 30},
    {left: 2, bottom: 74}, {left: 11, bottom: 50}, {left: 5, bottom: 20},
    {left: 13, bottom: 68}, {left: 12, bottom: 38},
  ];
  const faces = ['fat_1_s.webp','fat_2_m.webp','fat_5_warai.webp','fat_4_niyari.webp','fat_2_m.webp','fat_6_dakitsuki.webp','fat_1_s.webp','fat_5_warai.webp'];
  const list = [];
  let busy = false;  // 破裂演出中は追加禁止（配列競合でお化け脂肪くんが残る）
  function update(n){ counter.textContent = '脂肪くん×' + n; counter.style.display = n ? 'block' : 'none'; }
  return {
    add(size){
      if (busy || list.length >= spots.length) return;
      const p = spots[list.length];
      const el = document.createElement('div');
      el.className = 'fat';
      el.style.left = p.left + '%'; el.style.bottom = p.bottom + '%';
      el.style.animationDelay = (-list.length * .7) + 's';
      el.style.animationDuration = (2.2 + (list.length % 3) * .5) + 's';
      const file = (size === 'L') ? 'fat_3_l.webp' : faces[list.length % faces.length];
      if (size === 'L') el.style.height = '15%';  // ドカ食い産は大きい
      el.innerHTML = `<img src="${ASSET}${file}">`;
      wrap.appendChild(el);
      el.animate([{transform:'scale(0)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:350,easing:'ease-out'});
      SND.pop();
      list.push(el); update(list.length);
    },
    drift(dx){ /* 歩行中は妖精なのでふわっと追従（現状は位置固定＝一緒に移動して見える） */ },
    burstAll(){
      if (busy || !list.length) return;
      busy = true;
      const snapshot = [...list];
      list.length = 0;  // 先に空にして以降のaddと衝突させない
      let remaining = snapshot.length;
      snapshot.forEach((el,k)=>{
        setTimeout(()=>{
          const img = el.querySelector('img');
          img.src = ASSET + 'fat_8_haretsu.webp'; SND.burst();
          el.animate([{transform:'scale(1)'},{transform:'scale(1.5)'}],{duration:200,fill:'forwards'});
          setTimeout(()=>{ img.src = ASSET + 'fat_9_shometsu.webp'; el.style.opacity = '0'; }, 220);
          setTimeout(()=>{
            el.remove();
            remaining--;
            if (remaining === 0) busy = false;
          }, 650);
        }, k * 330);
      });
      // カウンタは破裂のたびに減らす（表示専用）
      let shown = snapshot.length;
      snapshot.forEach((_,k)=> setTimeout(()=>{ shown--; update(shown); }, k * 330 + 230));
    },
    shrinkAll(){  // 学習パート: 小さくなる（でも消えない）
      [...wrap.querySelectorAll('.fat img')].forEach(im => {
        im.style.transition = 'transform .9s ease';
        im.style.transform = 'scale(.55)';
      });
      SND.tap();
    },
    restoreAll(){  // 学習パート: ぷくーっと元に戻る
      [...wrap.querySelectorAll('.fat img')].forEach(im => {
        im.style.transition = 'transform .7s cubic-bezier(.3,1.6,.5,1)';
        im.style.transform = 'scale(1)';
      });
      SND.pop();
    },
    count(){ return list.length; }
  };
})();

/* ================= 会話・選択肢UI ================= */
const UI = (() => {
  const nameEl = document.getElementById('talkName');
  const textEl = document.getElementById('talkText');
  const chEl = document.getElementById('choices');
  let typeTimer = null, fullText = '';
  function say(name, text){
    nameEl.textContent = name;
    fullText = text;
    const talk = textEl.closest('.talk');
    // 自動フィット: 全文で測ってから打ち始める（見切れ防止）
    textEl.innerHTML = text;
    let size = 14.5;
    textEl.style.fontSize = size + 'px';
    while (talk.scrollHeight > talk.clientHeight + 2 && size > 12.5) {  // 可読性の下限12.5px
      size -= 0.5;
      textEl.style.fontSize = size + 'px';
    }
    // タイプライター表示（タグは瞬時・文字は1つずつ）
    clearInterval(typeTimer);
    const tokens = text.match(/<[^>]+>|[\s\S]/g) || [];
    let i = 0, out = '';
    textEl.innerHTML = '';
    typeTimer = setInterval(() => {
      while (i < tokens.length && tokens[i].startsWith('<')) out += tokens[i++];
      if (i < tokens.length) out += tokens[i++];
      textEl.innerHTML = out;
      if (i % 4 === 0) SND.blip();
      if (i >= tokens.length) { clearInterval(typeTimer); typeTimer = null; }
    }, 26);
    talk.scrollTop = 0;
  }
  // 会話帯タップで全文スキップ
  document.querySelector('.talk').addEventListener('click', () => {
    if (typeTimer) {
      clearInterval(typeTimer); typeTimer = null;
      textEl.innerHTML = fullText;
    }
  });
  function progress(cur, total){  // Q1〜Q4の進捗ドット（0で非表示）
    const d = document.getElementById('qdots');
    d.textContent = cur ? '●'.repeat(cur) + '○'.repeat(total - cur) : '';
  }
  function buttons(items){  // items: [{label, value}] → Promise<value>
    return new Promise(res => {
      chEl.innerHTML = '';
      let picked = false;  // 素早い2連タップでタイマーが二重に走り、次の質問のUIを消す事故を防ぐ
      items.forEach(it => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = it.label;
        b.onclick = () => {
          if (picked) return;
          picked = true;
          SND.tap();
          b.classList.add('sel');  // 選択状態を一瞬見せてから進む（Noom式）
          setTimeout(() => { chEl.innerHTML = ''; res(it.value); }, 220);
        };
        chEl.appendChild(b);
      });
    });
  }
  function multi(items, okLabel){  // 複数選択 → Promise<value[]>
    return new Promise(res => {
      chEl.innerHTML = '';
      const sel = new Set();
      items.forEach(it => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = it.label;
        b.onclick = () => {
          SND.tap();
          if (sel.has(it.value)) { sel.delete(it.value); b.classList.remove('sel'); }
          else { sel.add(it.value); b.classList.add('sel'); }
          ok.style.display = sel.size ? 'block' : 'none';
        };
        chEl.appendChild(b);
      });
      const ok = document.createElement('button');
      ok.className = 'multiOk'; ok.textContent = '▶ これで決定！'; ok.style.display = 'none';
      ok.onclick = () => { SND.tap(); chEl.innerHTML = ''; res([...sel]); };
      chEl.appendChild(ok);
    });
  }
  function tapNext(label){
    return new Promise(res => {
      chEl.innerHTML = '';
      const b = document.createElement('button');
      b.className = 'tapNext'; b.innerHTML = label || '▶ タップですすむ';
      b.onclick = () => { SND.tap(); chEl.innerHTML = ''; res(); };
      chEl.appendChild(b);
    });
  }
  // カレンダー（今日以降14日・最大maxSel日選択・選択順=希望順）
  function calendar(maxSel){
    return new Promise(res => {
      chEl.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'cal';
      const today = new Date();
      const first = new Date(today.getTime() + 86400000);  // 明日から
      wrap.innerHTML = `<div class="mon">${first.getMonth()+1}月</div>` +
        '日月火水木金土'.split('').map(d => `<div class="dow">${d}</div>`).join('') +
        Array(first.getDay()).fill('<div></div>').join('');
      const sel = [];
      for (let i = 0; i < 14; i++) {
        const d = new Date(first.getTime() + i * 86400000);
        const b = document.createElement('button');
        b.textContent = d.getDate();
        if (d.getDate() === 1 && i > 0) {
          const m = document.createElement('div');
          m.className = 'mon'; m.textContent = (d.getMonth()+1) + '月';
          wrap.appendChild(m);
          for (let k = 0; k < d.getDay(); k++) wrap.appendChild(document.createElement('div'));
        }
        const val = `${d.getMonth()+1}/${d.getDate()}`;
        b.onclick = () => {
          SND.tap();
          const idx = sel.indexOf(val);
          if (idx >= 0) { sel.splice(idx, 1); b.classList.remove('sel'); }
          else if (sel.length < maxSel) { sel.push(val); b.classList.add('sel'); }
          [...wrap.querySelectorAll('button.sel')].forEach(btn => {
            const v = btn.__val;
            btn.dataset.ord = sel.indexOf(v) + 1;
          });
          ok.style.display = sel.length ? 'block' : 'none';
        };
        b.__val = val;
        wrap.appendChild(b);
      }
      chEl.appendChild(wrap);
      const ok = document.createElement('button');
      ok.className = 'multiOk'; ok.textContent = '▶ この日程で決定！'; ok.style.display = 'none';
      ok.onclick = () => { SND.tap(); chEl.innerHTML = ''; res(sel); };
      chEl.appendChild(ok);
    });
  }
  // 時間プルダウン（常に第1〜第3希望の3枠。カレンダー未選択の枠は日付も選べる）
  function timePick(dates){
    return new Promise(res => {
      chEl.innerHTML = '';
      const SEL_CSS = 'flex:1;padding:11px 8px;border-radius:10px;border:2px solid #f0cfdd;font-family:inherit;font-weight:800;color:#5c4a52;background:#fff;font-size:13.5px;min-width:0;';
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;gap:8px;padding-top:4px;';
      const dateOpts = [];
      for (let i = 1; i <= 14; i++) {
        const d = new Date(Date.now() + i * 86400000);
        dateOpts.push({l: `${d.getMonth()+1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）`, v: `${d.getMonth()+1}/${d.getDate()}`});
      }
      const rows = [];
      const ok = document.createElement('button');
      function update(){
        const r1 = rows[0];
        ok.style.display = (r1.timeSel.value && (r1.fixedDate || r1.dateSel.value)) ? 'block' : 'none';
      }
      for (let i = 0; i < 3; i++) {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:7px;font-weight:900;color:#5c4a52;font-size:12.5px;';
        const label = document.createElement('span');
        label.style.cssText = 'white-space:nowrap;';
        label.textContent = `第${i+1}希望`;
        row.appendChild(label);
        let dateSel = null;
        if (dates[i]) {
          const fixed = document.createElement('span');
          fixed.style.cssText = 'white-space:nowrap;color:#c9557f;font-size:13.5px;';
          fixed.textContent = dates[i];
          row.appendChild(fixed);
        } else {
          dateSel = document.createElement('select');
          dateSel.style.cssText = SEL_CSS + 'max-width:42%;';
          dateSel.innerHTML = '<option value="">日にち</option>' + dateOpts.map(o => `<option value="${o.v}">${o.l}</option>`).join('');
          dateSel.onchange = () => { SND.tap(); update(); };
          row.appendChild(dateSel);
        }
        const timeSel = document.createElement('select');
        timeSel.style.cssText = SEL_CSS;
        let opts = '<option value="">時間</option>';
        for (let h = 10; h < 20; h++) ['00','30'].forEach(mm => { opts += `<option>${h}:${mm}</option>`; });
        timeSel.innerHTML = opts;
        timeSel.onchange = () => { SND.tap(); update(); };
        row.appendChild(timeSel);
        wrap.appendChild(row);
        rows.push({dateSel, timeSel, fixedDate: dates[i] || ''});
      }
      chEl.appendChild(wrap);
      ok.className = 'multiOk'; ok.textContent = '▶ この内容で仮押さえ！'; ok.style.display = 'none';
      ok.onclick = () => {
        SND.tap();
        const out = [];
        rows.forEach(r => {
          const d = r.fixedDate || (r.dateSel && r.dateSel.value);
          if (d && r.timeSel.value) out.push({date: d, time: r.timeSel.value});
        });
        chEl.innerHTML = ''; res(out);
      };
      chEl.appendChild(ok);
    });
  }
  return { say, buttons, multi, tapNext, progress, calendar, timePick };
})();

          const hint = document.createElement('div');
          hint.className = 'scrollHint';
          hint.textContent = '▼ 下にスクロールできます';
          body.appendChild(hint);
          body.addEventListener('scroll', () => hint.remove(), {once:true});
        }
      });
      el.querySelector('.pop__btn').onclick = () => {
        SND.tap();
        el.classList.remove('show');
        el.innerHTML = '';
        res();
      };
    });
  }
  // カルーセル型カード（スワイプで送り・ボタンは1つ）
  function carousel({title, cards, btn}){
    return new Promise(res => {
      const inner = cards.map(c => `<div>${c}</div>`).join('');
      el.innerHTML = `<div class="pop__card">
        ${title ? `<div class="pop__title">${title}</div>` : ''}
        <div class="pop__body"><div class="caro">${inner}</div>
          <div class="caroDots">${cards.map((_,i)=>`<span data-i="${i}">●</span>`).join('')}</div>
          <div style="text-align:center;font-size:11px;color:#c39aae;font-weight:700;">← 横にスワイプ →</div>
        </div>
        <button class="pop__btn">${btn || '▶ つづける'}</button>
      </div>`;
      el.classList.add('show');
      const caro = el.querySelector('.caro');
      const dots = [...el.querySelectorAll('.caroDots span')];
      const updateDots = () => {
        const i = Math.min(cards.length - 1, Math.round(caro.scrollLeft / (caro.firstElementChild.offsetWidth + 10)));
        dots.forEach((d, k) => { d.innerHTML = k === i ? '<b>●</b>' : '●'; });
      };
      caro.addEventListener('scroll', updateDots, {passive:true});
      updateDots();
      el.querySelector('.pop__btn').onclick = () => {
        SND.tap(); el.classList.remove('show'); el.innerHTML = ''; res();
      };
    });
  }
  return { show, carousel };
})();

/* ================= 紙吹雪 ================= */
function confetti(n){
  const stage = document.getElementById('stage');
  const colors = ['#ff8fb3','#f5b93c','#7ac97a','#8fb3ff','#e0679a','#ffd3e4'];
  for (let i = 0; i < (n || 40); i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    c.style.animationDelay = (Math.random() * .8) + 's';
    stage.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

/* ================= スルリム撃退FX（注射器＋シェイク＋フラッシュ） ================= */
function sururimFX(n){
  const sy = document.getElementById('syringe');
  const fl = document.getElementById('flash');
  const app = document.getElementById('app');
  sy.classList.add('in');
  for (let k = 0; k < n; k++) {
    setTimeout(() => {
      sy.classList.add('jab');
      fl.style.opacity = '.65';
      app.classList.add('shake');
      setTimeout(() => { sy.classList.remove('jab'); fl.style.opacity = '0'; }, 140);
      setTimeout(() => { app.classList.remove('shake'); }, 330);
    }, 300 + k * 330);
  }
  setTimeout(() => { sy.classList.remove('in'); }, 300 + n * 330 + 500);
}

/* ================= LINE URL構築（クエスト版と同方式・var_互換） ================= */
function buildUrl(){
  const v = CONFIG.VAR_IDS;
  const p = new URLSearchParams();
  const s = (k, val) => { if (val && (!Array.isArray(val) || val.length)) p.set(`var_${k}`, Array.isArray(val) ? val.join(',') : val); };
  s(v.gender, answers.gender); s(v.age, answers.age);
  s(v.body_parts, answers.body_parts); s(v.diet_history, answers.diet_history);
  s(v.coupon, answers.coupon); s(v.clinic_area, answers.area); s(v.clinic, answers.clinic);
  (answers.prefs || []).forEach((pref, i) => {
    if (pref) { s(v['reserve_date' + (i+1)], pref.date); s(v['reserve_time' + (i+1)], pref.time); }
  });
  s(v.lp_source, CONFIG.LP_ID);
  const base = CONFIG.REDIRECT_URL || `https://line.me/R/ti/p/@${CONFIG.BOT_BASIC_ID}`;
  return `${base}?${p}`;
}
function openLine(){
  try { if (window.gtag) gtag('event','conversion',{send_to:'LINE_ADD'}); if (window.fbq) fbq('track','Lead'); } catch(e){ console.warn('tracking error', e); }
  window.location.href = buildUrl();
}

  document.getElementById('gate').remove();
  story();
}

  setTimeout(() => {
    [
      'bg_street.webp','bg_gym.webp','bg_clinic.webp',
      'pose_2_shock.webp','pose_3_onaka.webp','pose_4_naki.webp','pose_5_kangae.webp','pose_6_hirameki.webp','pose_7_おねがい.webp','pose_8_guts.webp',
      'fat_1_s.webp','fat_3_l.webp','fat_4_niyari.webp','fat_5_warai.webp','fat_6_dakitsuki.webp','fat_8_haretsu.webp','fat_9_shometsu.webp',
      'prop_1_sofa.webp','prop_2_parfait.webp','prop_3_cake.webp','prop_4_conveni.webp','prop_5_dumbbell.webp','prop_6_scale.webp','prop_7_fridge.webp','prop_8_salad.webp',
    ].forEach(f => { const im = new Image(); im.src = ASSET + f; });
  }, 800);
});
window.addEventListener('resize', () => {
  BG.load('bg_room.webp');
});
// タップ位置から「ほわん」を出す（全ボタン共通・イベント委任）
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.choices > button, .pop__btn, .gate__btns button, .lineBtn');
  if (!b) return;
  const r = b.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 0.9;
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.width = s.style.height = d + 'px';
  s.style.left = ((e.clientX || (r.left + r.width/2)) - r.left - d/2) + 'px';
  s.style.top = ((e.clientY || (r.top + r.height/2)) - r.top - d/2) + 'px';
  b.appendChild(s);
  setTimeout(() => s.remove(), 700);
});

document.getElementById('startSound').onclick = () => boot(true);
document.getElementById('startMute').onclick = () => boot(false);
document.getElementById('muteBtn').onclick = function(){
  const m = !SND.isMuted();
  SND.setMuted(m);
  this.textContent = m ? '×' : '♪';
};
